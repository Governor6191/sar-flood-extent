[project]
name = "sar-flood-extent"
version = "0.1.0"
description = "Sentinel-1 SAR flood-extent segmentation"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "torchvision",
    "segmentation-models-pytorch",
    "transformers",
    "rasterio",
    "geopandas",
    "albumentations",
    "wandb",
    "tqdm",
    "matplotlib",
    "datasets",
    "huggingface_hub",
    "numpy",
    "pandas",
    "scikit-learn",
    "tifffile",
    "shapely",
]

[tool.uv]
package = false

# Pull PyTorch from the CUDA 12.4 wheel index instead of the default CPU-only
# wheels on PyPI. The RTX 4070 driver supports CUDA 13.0, which is backward
# compatible with the cu124 runtime.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }